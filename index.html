      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does Paperless Companion connect to my Paperless-ngx server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It connects directly from your iPhone to your self-hosted Paperless-ngx instance over your local network, an HTTPS reverse proxy, Tailscale, or Cloudflare Access—with support for custom proxy headers and trusted self-signed certificates."
            }
          },
          {
            "@type": "Question",
            "name": "Which devices and iOS versions are supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Paperless Companion is built natively for iPhone on iOS 26 with Liquid Glass. It is an iPhone-only app."
            }
          },
          {
            "@type": "Question",
            "name": "What happens when I scan or edit documents offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pinned documents stay readable in your offline cache. New scans wait in the Upload Outbox and metadata edits queue in Pending Changes, syncing automatically once your server is reachable again."
            }
          },
          {
            "@type": "Question",
            "name": "Does the app collect analytics or route documents through third-party servers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. There are zero developer servers, zero analytics, and zero telemetry. Credentials and documents stay strictly between your iPhone and your server, protected optionally by Face ID, Touch ID, or Passcode lock."
            }
          },
          {
            "@type": "Question",
            "name": "Can I import from other apps or automate workflows on iPhone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can send PDFs and images straight from any app using the Save to Paperless action or share extension in the iOS Share Sheet, automate actions with Siri Shortcuts, and locate synced documents from iOS Spotlight search."
            }
          }
        ]
      }
    </script>

    <script>
      (function () {
        var stored = localStorage.getItem('pl_landing_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
