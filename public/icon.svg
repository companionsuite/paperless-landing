<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Paperless-ngx forest green canvas gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#227C2E" />
      <stop offset="52%" stop-color="#17541F" />
      <stop offset="100%" stop-color="#0C2C10" />
    </linearGradient>

    <!-- Soft radial ambient light behind the glass stack -->
    <radialGradient id="ambient-glow" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#3BC94E" stop-opacity="0.52" />
      <stop offset="48%" stop-color="#227C2E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0C2C10" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle bottom-right depth vignette -->
    <radialGradient id="depth-vignette" cx="85%" cy="88%" r="58%">
      <stop offset="0%" stop-color="#071809" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#071809" stop-opacity="0" />
    </radialGradient>

    <!-- Back sheet (Sheet 3) frosted glass fill & rim -->
    <linearGradient id="sheet3-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#E7F8E9" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="sheet3-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#E7F8E9" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.32" />
    </linearGradient>

    <!-- Middle sheet (Sheet 2) frosted glass fill & rim -->
    <linearGradient id="sheet2-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="55%" stop-color="#F3FCF4" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#E7F8E9" stop-opacity="0.26" />
    </linearGradient>
    <linearGradient id="sheet2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82" />
      <stop offset="45%" stop-color="#E7F8E9" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.50" />
    </linearGradient>

    <!-- Front sheet (Sheet 1) luminous Liquid Glass fill & specular rim -->
    <linearGradient id="sheet1-fill" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="55%" stop-color="#F3FCF4" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#E7F8E9" stop-opacity="0.84" />
    </linearGradient>
    <linearGradient id="sheet1-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#E7F8E9" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>

    <!-- Top-left inner specular sheen on front sheet -->
    <linearGradient id="sheet1-sheen" x1="0%" y1="0%" x2="65%" y2="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Green accent index pill gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#227C2E" />
      <stop offset="100%" stop-color="#124018" />
    </linearGradient>

    <!-- Subtle document line gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17541F" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#2DA43D" stop-opacity="0.16" />
    </linearGradient>

    <!-- Soft layered drop shadows -->
    <filter id="shadow-back" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#071809" flood-opacity="0.34" />
    </filter>
    <filter id="shadow-mid" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#071809" flood-opacity="0.36" />
    </filter>
    <filter id="shadow-front" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#071809" flood-opacity="0.42" />
    </filter>

    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="224" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Full-bleed opaque background (no rounded corners, no transparency) -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-grad)" />
  <rect x="0" y="0" width="1024" height="1024" fill="url(#ambient-glow)" />
  <rect x="0" y="0" width="1024" height="1024" fill="url(#depth-vignette)" />

  <!-- Stacked Liquid Glass Sheets -->
  <!-- Sheet 3 (Back-most, fanned left & stepped up-left) -->
  <g transform="translate(492, 500) rotate(-10) translate(-492, -500)" filter="url(#shadow-back)">
    <rect x="256" y="188" width="430" height="560" rx="52" fill="url(#sheet3-fill)" stroke="url(#sheet3-rim)" stroke-width="2.5" />
  </g>

  <!-- Sheet 2 (Middle, gently fanned & stepped) -->
  <g transform="translate(514, 514) rotate(-4.5) translate(-514, -514)" filter="url(#shadow-mid)">
    <rect x="290" y="218" width="430" height="560" rx="52" fill="url(#sheet2-fill)" stroke="url(#sheet2-rim)" stroke-width="2.5" />
  </g>

  <!-- Sheet 1 (Front-most upright Liquid Glass document) -->
  <g filter="url(#shadow-front)">
    <rect x="332" y="246" width="436" height="568" rx="54" fill="url(#sheet1-fill)" stroke="url(#sheet1-rim)" stroke-width="3" />
    <!-- Inner specular glass sheen -->
    <rect x="335" y="249" width="430" height="562" rx="51" fill="url(#sheet1-sheen)" />

    <!-- Clean green accent scan/index pill -->
    <rect x="404" y="332" width="186" height="44" rx="22" fill="url(#pill-grad)" />
    <!-- Crisp specular top highlight on the pill -->
    <rect x="410" y="335" width="174" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.28" />

    <!-- Subtle fresh-green status dot / index marker -->
    <circle cx="670" cy="354" r="14" fill="#2DA43D" fill-opacity="0.32" />
    <circle cx="670" cy="354" r="7" fill="#17541F" />

    <!-- Clean document content bars -->
    <rect x="404" y="438" width="292" height="24" rx="12" fill="url(#line-grad)" />
    <rect x="404" y="492" width="246" height="24" rx="12" fill="url(#line-grad)" />
    <rect x="404" y="546" width="272" height="24" rx="12" fill="url(#line-grad)" />
    <rect x="404" y="600" width="178" height="24" rx="12" fill="url(#line-grad)" />

    <!-- Subtle bottom archive rule / index bar -->
    <rect x="404" y="694" width="292" height="12" rx="6" fill="#17541F" fill-opacity="0.14" />
    <rect x="404" y="694" width="112" height="12" rx="6" fill="#2DA43D" fill-opacity="0.55" />
  </g>
  </g>
</svg>
